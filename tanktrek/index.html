<body><main class="app">
<header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 32 32" width="27" height="27" aria-hidden="true"><path fill="currentColor" d="M5 18h22l3 4-3 5H5l-3-5zM10 10h12l3 8H7zM15 4h4v9h-4z"/><path stroke="#b6d38d" stroke-width="2" d="M7 22h18"/></svg></div><div><h1>TANK TREK</h1><small>COGNITIVE CODGER • FIELD OPERATIONS</small></div></div><div class="tools"><select id="difficulty" aria-label="Difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Veteran</option></select><button class="small" id="new" title="New game">New</button><button class="small" id="sound" title="Toggle sound" aria-label="Toggle sound">♫</button><button class="small" id="help" aria-label="Help">?</button></div></header>
<section class="stats" aria-label="Game statistics"><div class="stat"><span>Level</span><strong id="level">01</strong></div><div class="stat threat"><span>Detector</span><strong id="threat">0</strong></div><div class="stat lives"><span>Lives</span><strong id="lives">6</strong></div><div class="stat ammo"><span>Shells</span><strong id="ammo">3</strong></div><div class="stat"><span>Score</span><strong id="score">0</strong></div></section>
<section class="field" id="field"><canvas id="canvas" aria-label="Minefield, tap a square to aim or mark it"></canvas><div class="fieldtop"><div class="tag" id="fieldSize">WOODLAND</div><div class="view"><button id="angle" title="Change viewing angle">Overhead</button><button id="projection" title="Change camera lens">Ortho</button><button class="zoom" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><button class="zoom" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button></div></div><label class="speed-control" title="Tank movement and turret animation speed">Speed <select id="speed" aria-label="Tank animation speed"><option value="fast">Fast</option><option value="normal" selected>Normal</option><option value="slow">Slow</option></select></label><div class="compass" id="compass">↑ N • → E</div><div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions" id="dialogActions"></div></div></div></section>
<div class="status" role="status"><b id="message">Reach the far safe zone.</b><span class="best" id="best">Best 0</span></div>
<section class="controls" aria-label="Game controls"><div class="controlgroup"><div class="ctlhead">Drive <small>WASD / arrows</small></div><div class="pad"><span></span><button data-move="0" aria-label="Drive north">▲</button><span></span><button data-move="3" aria-label="Drive west">◀</button><button data-move="2" aria-label="Drive south">▼</button><button data-move="1" aria-label="Drive east">▶</button></div><div class="flagline"><button id="flag" title="Toggle marker mode (F)">⚑ Mark mines</button></div></div><div class="controlgroup"><div class="ctlhead">Turret <small>I J K L</small></div><div class="pad"><span></span><button class="aim" data-aim="0" aria-label="Aim north">N</button><span></span><button class="aim" data-aim="3" aria-label="Aim west">W</button><button class="aim" data-aim="2" aria-label="Aim south">S</button><button class="aim" data-aim="1" aria-label="Aim east">E</button></div><div class="flagline"><button id="clearFlags" title="Remove all flags">Clear flags</button></div></div><div class="controlgroup"><div class="ctlhead">Shell range <small>1 / 2 / 3</small></div><div class="range"><button data-range="1">1</button><button data-range="2">2</button><button data-range="3">3</button></div><button class="gold fire" id="fire">◎ FIRE</button><div class="flagline"><button id="targetInfo" disabled>2 squares</button></div></div></section>
<footer class="footer"><span>TANK TREK • PROTOTYPE 0.13</span><span>Move carefully. Trust the detector. Make every shell count.</span></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), D=[[0,-1],[1,0],[0,1],[-1,0]], NAMES=['N','E','S','W'];
const SETTINGS={Easy:{density:.15,lives:9,mul:1,remember:true},Medium:{density:.23,lives:6,mul:1.5,remember:true},Hard:{density:.32,lives:3,mul:2,remember:true},Veteran:{density:.36,lives:1,mul:3,remember:false}};
const key=(x,y)=>`${x},${y}`, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeField(level,difficulty,seed){
 const rand=rng(seed), cols=Math.min(18,6+2*Math.floor(level/2)), rows=Math.min(20,8+2*Math.floor((level-1)/2)), mid=Math.floor(cols/2);
 const cells=Array.from({length:rows},(_,y)=>Array.from({length:cols},(_,x)=>({x,y,mine:false,obstacle:null,visited:false,cleared:false,flag:false,track:0,crater:false,remains:null,scored:false,shade:rand(),variant:rand(),safe:y===0||y===rows-1})));
 const inside=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows;
 // A simple non-repeating winding path, with horizontal stretches and guaranteed northward progress.
 const route=new Set(); let x=mid,y=rows-1; route.add(key(x,y));
 while(y>0){y--;route.add(key(x,y));if(y>0&&rand()<.63){const dir=rand()<.5?-1:1, steps=1+Math.floor(rand()*Math.min(3,Math.ceil(cols/3)));for(let j=0;j<steps;j++){let nx=x+dir;if(nx<0||nx>=cols)break;x=nx;route.add(key(x,y));}}}
 // Early fields have a corridor whose cells report zero adjacent mines. Later levels have a safe route but may require risk.
 const guided=level<=({Easy:4,Medium:2,Hard:1,Veteran:1}[difficulty]), protectedMines=new Set(route);
 if(guided)for(const k of route){const [a,b]=k.split(',').map(Number);for(const [dx,dy] of D)if(inside(a+dx,b+dy))protectedMines.add(key(a+dx,b+dy));}
 let candidates=[];for(const row of cells)for(const c of row)if(!c.safe&&!route.has(key(c.x,c.y)))candidates.push(c);
 shuffle(candidates,rand);let obstacleCount=Math.min(candidates.length,Math.round(cols*(rows-2)*.11));for(const c of candidates.slice(0,obstacleCount))c.obstacle=rand()<.62?'tree':'rock';
 let mineCandidates=candidates.filter(c=>!c.obstacle&&!protectedMines.has(key(c.x,c.y)));shuffle(mineCandidates,rand);
 const density=Math.min(.45,SETTINGS[difficulty].density+(level-1)*.009), total=Math.min(mineCandidates.length,Math.round(cols*(rows-2)*density));
 // Slight preference for clusters while still mixing isolated mines.
 for(let i=0;i<total;i++){let idx=0;if(i>0&&rand()<.33){let found=mineCandidates.findIndex(c=>D.some(([dx,dy])=>inside(c.x+dx,c.y+dy)&&cells[c.y+dy][c.x+dx].mine));if(found>=0)idx=found;}mineCandidates.splice(idx,1)[0].mine=true;}
 return {cells,cols,rows,start:{x:mid,y:rows-1},route,guided,seed};
}
function neighbors(f,x,y){return D.map(([dx,dy])=>f.cells[y+dy]?.[x+dx]).filter(Boolean);}
function threatAt(f,x,y){return neighbors(f,x,y).filter(c=>c.mine).length;}
function chainAt(f,x,y){const first=f.cells[y]?.[x];if(!first?.mine)return [];const out=[first],seen=new Set([key(x,y)]);for(let i=0;i<out.length;i++)for(const c of neighbors(f,out[i].x,out[i].y))if(c.mine&&!seen.has(key(c.x,c.y))){seen.add(key(c.x,c.y));out.push(c);}return out;}
function reachable(f,zero=false){const todo=[f.start],seen=new Set([key(f.start.x,f.start.y)]);for(let i=0;i<todo.length;i++){const c=todo[i];if(c.y===0)return true;for(const n of neighbors(f,c.x,c.y))if(!n.mine&&!n.obstacle&&(!zero||threatAt(f,n.x,n.y)===0)&&!seen.has(key(n.x,n.y))){seen.add(key(n.x,n.y));todo.push(n);}}return false;}
let game, angle='overhead', projection='ortho', markMode=false, muted=false, busy=false, modal=false, epoch=0, visual={x:0,y:0,body:0,turret:0}, anim=null, effects=[], shell=null, framePending=false, audio=null;
function storeGet(k){try{return localStorage.getItem(k);}catch{return null;}}
function storeSet(k,v){try{localStorage.setItem(k,v);}catch{}}
const SPEEDS={fast:1,normal:1.8,slow:3};
let animationSpeed='normal';
function setAnimationSpeed(value){animationSpeed=Object.hasOwn(SPEEDS,value)?value:'normal';$('speed').value=animationSpeed;storeSet('tank-trek-animation-speed',animationSpeed);}
function bestKey(){return 'tank-trek-v01-best-'+game.difficulty;}
function score(n){game.score+=Math.round(n*SETTINGS[game.difficulty].mul);if(game.score>Number(storeGet(bestKey())||0))storeSet(bestKey(),String(game.score));}
function say(s){$('message').textContent=s;}
function cell(x,y){return game.field.cells[y]?.[x];}
function target(){let [dx,dy]=D[game.aim];return cell(game.x+dx*game.range,game.y+dy*game.range);}
function refresh(){const c=target();$('level').textContent=String(game.level).padStart(2,'0');$('threat').textContent=game.phase==='lost'?'—':threatAt(game.field,game.x,game.y);$('lives').textContent=game.lives;$('ammo').textContent=game.ammo;$('score').textContent=game.score;$('best').textContent='Best '+Number(storeGet(bestKey())||0).toLocaleString();$('fieldSize').textContent=`WOODLAND • ${game.field.cols} × ${game.field.rows}`;$('fire').disabled=busy||modal||game.phase!=='play'||!c||game.ammo===0;$('targetInfo').textContent=c?`${NAMES[game.aim]} • ${game.range} square${game.range===1?'':'s'}`:'Out of bounds';$('flag').classList.toggle('on',markMode);$('field').classList.toggle('marking',markMode);$('flag').setAttribute('aria-pressed',markMode);$('flag').textContent=markMode?'⚑ Marking ON':'⚑ Mark mines';$('sound').textContent=muted?'♪×':'♫';$('sound').setAttribute('aria-pressed',!muted);document.querySelectorAll('[data-aim]').forEach(b=>{b.classList.toggle('on',+b.dataset.aim===game.aim);b.disabled=busy||modal||game.phase!=='play';});document.querySelectorAll('[data-range]').forEach(b=>{b.classList.toggle('on',+b.dataset.range===game.range);b.disabled=modal||game.phase!=='play';});document.querySelectorAll('[data-move]').forEach(b=>b.disabled=busy||modal||game.phase!=='play');$('clearFlags').disabled=busy||modal||game.phase!=='play';$('flag').disabled=busy||modal||game.phase!=='play';requestDraw();}
function startGame(difficulty){zoomIndex=1;updateZoomButtons();epoch++;hideDialog();game={difficulty,level:1,lives:SETTINGS[difficulty].lives,score:0,phase:'play'};$('difficulty').value=difficulty;newLevel();}
function newLevel(){stopEngine();wreck=null;epoch++;busy=false;anim=null;effects=[];shell=null;markMode=false;game.field=makeField(game.level,game.difficulty,(Math.random()*4294967296)>>>0);game.x=game.field.start.x;game.y=game.field.start.y;game.aim=0;game.range=2;game.ammo=3;game.levelDeaths=0;game.phase='play';game.reveal=false;cell(game.x,game.y).visited=true;visual={x:game.x,y:game.y,body:0,turret:0};rebuildScenery();say('Cross the minefield to the far dirt strip.');refresh();}
function canAct(){return !busy&&!modal&&game.phase==='play';}
function turnTowards(a,b){return a+Math.atan2(Math.sin(b-a),Math.cos(b-a));}
function animate(to,duration,done){const from={...visual};anim={from,to:{...visual,...to},start:performance.now(),duration:duration*SPEEDS[animationSpeed],done,epoch};if('body'in to)anim.to.body=turnTowards(from.body,to.body);if('turret'in to)anim.to.turret=turnTowards(from.turret,to.turret);requestDraw();}
function aim(d){if(!canAct())return;game.aim=d;animate({turret:d*Math.PI/2},125,null);refresh();}
function range(n){if(modal||game.phase!=='play'||![1,2,3].includes(n))return;game.range=n;refresh();}
function move(d){
 if(!canAct())return;
 const [dx,dy]=D[d],nx=game.x+dx,ny=game.y+dy,c=cell(nx,ny);
 if(!c){say('Field boundary.');return;}
 if(c.obstacle){say(c.obstacle==='tree'?'Tree blocking the route.':'Rock blocking the route.');return;}
 if(c.flag){say('Flagged square. Remove the marker to enter.');return;}

function flagCell(c){if(!canAct())return;if(!c){say('Select a square inside the minefield.');return;}if(!c.flag&&(c.safe||c.visited||c.cleared||c.obstacle)){say('Markers can only be placed on unexplored, open ground.');return;}c.flag=!c.flag;say(c.flag?'Suspected mine marked.':'Marker removed.');refresh();}

function help(){if(busy||modal)return;showDialog('Field manual',`<p>Cross from the bottom dirt strip to the top. Mines are hidden; the detector counts mines north, east, south and west of your tank.</p><ul><li>Drive with arrows / WASD or the Drive pad. Trees, rocks and flags block movement.</li><li>Use I/J/K/L or the Turret pad to aim; 1–3 sets range (defaults to 2 at the start of each level). Space fires. Tap a valid square to aim.</li><li>On Easy only, a direct shell hit on a mine triggers a chain reaction through cardinal neighbours. On Medium, Hard and Veteran, only the directly hit mine detonates. Mine explosions leave large craters; empty shell impacts leave small craters. Driving onto a mine detonates that mine alone. A mine on or beside your tank destroys it. Empty impacts clear their own square only.</li><li>F toggles markers; tap unknown ground or right-click to flag. On Veteran, past detector numbers are hidden.</li><li>C switches view, P switches projection. Use the + and − camera buttons to zoom; the camera follows the tank at higher zoom. Three shells refill only on level completion.</li><li>Lives carry over between levels. Gain one bonus life after completing every tenth level.</li><li>Speed changes tank movement and turret animation. Fast is the original speed; Normal and Slow are more relaxed.</li></ul><p>Points: new safe tile 10, mine cleared by shell 25, level 250, unused shell 50, flawless 200; difficulty multiplier applies.</p>`,[['Continue',hideDialog,true]]);}
